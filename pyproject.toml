[project]
name = "freshdirect-planner"
version = "0.1.0"
description = "AI agent + web app that plans a household's weekly FreshDirect grocery order"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.44",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.19",
    "typer>=0.12",
    "rich>=13.7",
    "python-dateutil>=2.9",
    "anthropic>=0.40",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Scheduler for the weekly autonomous run (wired up later in Phase 3).
scheduler = [
    "apscheduler>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
fdplanner = "app.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
