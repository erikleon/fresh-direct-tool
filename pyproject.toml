[project]
name = "freshdirect-planner"
version = "0.1.0"
description = "AI agent + web app that plans a household's weekly FreshDirect grocery order"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.44",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Pulled in starting Phase 1+; kept separate so the Phase 0 spike stays lean.
app = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.19",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "anthropic>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
fdplanner = "app.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
